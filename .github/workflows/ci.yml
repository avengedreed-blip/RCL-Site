name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate portfolio
        run: npm run check:portfolio

      - name: Build
        run: npm run build

      - name: Smoke check static output
        run: npm run smoke

      - name: Install browser for regression checks
        run: npx playwright install --with-deps chromium --only-shell

      - name: Browser and accessibility regression checks
        run: npm run check:browser

      - name: Analytics excluded outside production
        run: npm run check:analytics-browser

      - name: Agency partnership journey and accessibility
        run: npm run check:agency

      - name: Build production analytics boundary
        run: npm run build
        env:
          VERCEL_ENV: production

      - name: Analytics privacy browser checks
        run: npm run check:analytics-browser -- --production
